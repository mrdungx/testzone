name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/chinese-trip-learning-app-U3Le0
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap shared progress bucket (first deploy only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CONFIG_FILE=basic-mandarin-for-ahasliders/config.js
          if grep -q 'bucket:' "$CONFIG_FILE" 2>/dev/null; then
            echo "Shared bucket already configured — skipping bootstrap."
            exit 0
          fi
          echo "Creating anonymous kvdb.io bucket..."
          BUCKET=$(curl -fsS -X POST https://kvdb.io/ --max-time 15 || true)
          if [ -z "${BUCKET:-}" ] || [ "${#BUCKET}" -gt 64 ]; then
            echo "kvdb.io unreachable or returned unexpected payload — writing local-only config."
            cat > "$CONFIG_FILE" <<EOF
          // Auto-generated by .github/workflows/pages.yml
          // Shared backend unavailable at bootstrap time — running in local-only mode.
          window.APP_CONFIG = { mode: 'local' };
          EOF
          else
            echo "Bucket created: $BUCKET"
            cat > "$CONFIG_FILE" <<EOF
          // Auto-generated by .github/workflows/pages.yml on first deploy.
          // Edit only if you want to swap backends. The bucket value is a non-secret
          // identifier — anyone with the URL can read/write the leaderboard.
          window.APP_CONFIG = {
            mode: 'shared',
            endpoint: 'https://kvdb.io',
            bucket: '$BUCKET'
          };
          EOF
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$CONFIG_FILE"
          git commit -m "Bootstrap shared leaderboard config"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
