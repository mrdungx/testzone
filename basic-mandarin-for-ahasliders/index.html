<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FF2D87" />
  <title>Quick Mandarin for AhaSlides</title>
  <meta name="description" content="A 10-day countdown that teaches AhaSliders practical Mandarin for the China trip — tones, WeChat/Alipay, getting around, food, and emergencies. Uses Hán Việt cognates for Vietnamese speakers." />

  <!-- Open Graph (Slack, Facebook, LinkedIn link previews) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AhaSlides" />
  <meta property="og:title" content="Quick Mandarin for AhaSlides" />
  <meta property="og:description" content="A 10-day countdown for AhaSliders heading to China. 15 min/day · tones · WeChat & Alipay · live leaderboard." />
  <meta property="og:url" content="https://mrdungx.github.io/testzone/basic-mandarin-for-ahasliders/" />
  <meta property="og:image" content="https://mrdungx.github.io/testzone/basic-mandarin-for-ahasliders/og-card.png?v=2" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Quick Mandarin for AhaSlides — 10 days, tones, 100+ phrases" />

  <!-- Twitter card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Quick Mandarin for AhaSlides" />
  <meta name="twitter:description" content="A 10-day countdown for AhaSliders heading to China. 15 min/day · tones · WeChat & Alipay · live leaderboard." />
  <meta name="twitter:image" content="https://mrdungx.github.io/testzone/basic-mandarin-for-ahasliders/og-card.png?v=2" />

  <link rel="icon" type="image/svg+xml" href="aha-logo.svg?v=2" />
  <link rel="stylesheet" href="styles.css?v=4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://api.dicebear.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="topbar">
    <button id="back-btn" class="icon-btn" aria-label="Back" hidden>←</button>
    <div class="brand">
      <img class="brand-logo" src="aha-logo.svg?v=2" alt="AhaSlides" width="26" height="26" />
      <h1 id="title">Quick Mandarin for AhaSlides</h1>
    </div>
    <button id="cheatsheet-btn" class="icon-btn" aria-label="Cheat sheet" title="Cheat sheet">📋</button>
  </header>

  <main id="app"></main>

  <template id="tpl-home">
    <section class="home">
      <div class="hero">
        <div class="hero-row">
          <button class="hero-profile" id="profile-chip" type="button" aria-label="Edit profile">
            <span class="hero-avatar" id="hero-avatar"></span>
            <span class="hero-name-block">
              <small>Bạn là</small>
              <strong id="hero-name">—</strong>
            </span>
            <span class="hero-edit">✎</span>
          </button>
        </div>
        <div class="hero-stats">
          <div><strong id="days-left">—</strong><span>days to trip</span></div>
          <div><strong id="words-learned">0</strong><span>words</span></div>
          <div><strong id="streak">0</strong><span>day streak</span></div>
        </div>
      </div>

      <div class="tip-card">
        <strong>Tip:</strong> Many Chinese words are nearly identical to Vietnamese (Hán Việt). Look for the <span class="hv-pill">HV</span> badge — those are essentially free for you.
      </div>

      <div class="section-row">
        <h3 class="section-h">Your 10-day plan</h3>
      </div>
      <ol id="lesson-list" class="lesson-list"></ol>

      <div class="section-row">
        <h3 class="section-h">Learners</h3>
        <span class="section-h-right" id="learners-status"></span>
      </div>
      <div id="leaderboard" class="leaderboard"></div>

      <div class="util-row">
        <button id="reset-btn" class="ghost-btn">Reset progress</button>
      </div>
    </section>
  </template>

  <template id="tpl-lesson">
    <section class="lesson">
      <div class="lesson-head">
        <span class="day-pill" id="day-pill"></span>
        <h2 id="lesson-title"></h2>
        <p class="lesson-sub" id="lesson-sub"></p>
      </div>

      <div id="lesson-body"></div>

      <div class="step-nav">
        <button id="prev-step" class="ghost-btn">← Back</button>
        <div class="progress-dots" id="progress-dots"></div>
        <button id="next-step" class="primary-btn">Next →</button>
      </div>
    </section>
  </template>

  <template id="tpl-cheatsheet">
    <section class="cheatsheet">
      <h2>📋 Trip Cheat Sheet</h2>
      <p class="cheat-sub">Mọi câu cần dùng, một trang. Bấm chữ Hán để nghe phát âm.</p>
      <div id="cheat-body"></div>
    </section>
  </template>

  <template id="tpl-onboarding">
    <div class="onboarding-backdrop">
      <div class="onboarding-card">
        <div class="onboarding-head">
          <div class="hero-flag">🇨🇳</div>
          <h2 id="onb-title">Welcome! Pick a nickname & avatar</h2>
          <p id="onb-sub">Bạn sẽ xuất hiện trên bảng xếp hạng cùng những người học khác.</p>
        </div>

        <label class="onb-label" for="onb-nickname">Nickname</label>
        <input id="onb-nickname" type="text" maxlength="20" placeholder="e.g. Dave, Linh, …" autocomplete="off" />

        <label class="onb-label">Avatar style</label>
        <div class="onb-styles" id="onb-styles"></div>

        <div class="onb-grid-head">
          <label class="onb-label">Pick one</label>
          <button type="button" class="ghost-btn small" id="onb-shuffle">🎲 Shuffle</button>
        </div>
        <div class="onb-avatars" id="onb-avatars"></div>

        <button class="primary-btn full" id="onb-submit" disabled>Start learning! →</button>
        <button type="button" class="ghost-btn full" id="onb-cancel" hidden>Cancel</button>
      </div>
    </div>
  </template>

  <script src="config.js?v=4"></script>
  <script src="lessons.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
