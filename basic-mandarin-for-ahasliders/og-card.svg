<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF2D87"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- decorative Chinese hanzi -->
  <text x="1140" y="540" text-anchor="end" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="280" font-weight="700" fill="#fff" opacity="0.13">中文</text>

  <!-- eyebrow -->
  <text x="80" y="200" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" opacity="0.85" letter-spacing="4">10 DAYS  ·  TONES  ·  100+ PHRASES</text>

  <!-- title -->
  <text x="80" y="340" font-family="Inter, Arial, sans-serif" font-size="118" font-weight="900" fill="#fff" letter-spacing="-3">Quick Mandarin</text>
  <text x="80" y="430" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="500" fill="#fff" opacity="0.92" letter-spacing="-1">for AhaSlides</text>

  <!-- aha wordmark -->
  <g transform="translate(80, 540)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="900" fill="#fff" letter-spacing="-3">aha</text>
    <circle cx="148" cy="-38" r="9" fill="#fff"/>
  </g>

</svg>
